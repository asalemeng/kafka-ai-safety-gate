# The whole stack with one command:
#
#   docker compose up --build
#
# Kafka, the topics, the gate, the audit sink (with signed checkpoints), the
# model service and the Chat API of the demo chatbot (http://localhost:8080). Kafka is reachable from your machine on localhost:9092.
# This file is for local development: no login, no encryption.
# For TLS + login + ACLs see docker-compose.secure.yml.

x-app: &app
  build: .
  image: safety-gate:local
  environment: &app-env
    KAFKA_BOOTSTRAP: kafka:19092

# Which model answers the demo chatbot. Set these in a file called .env next to
# this one (never committed), for example:
#   MODEL_PROVIDER=anthropic
#   ANTHROPIC_API_KEY=sk-ant-...
# Without a .env file the offline stand-in answers.
x-model-env: &model-env
  MODEL_PROVIDER: ${MODEL_PROVIDER:-stand-in}
  MODEL_NAME: ${MODEL_NAME:-}
  MODEL_BASE_URL: ${MODEL_BASE_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  MODEL_API_KEY: ${MODEL_API_KEY:-}
  DEMO_SECRET: ${DEMO_SECRET:-CANARY-NH-48213}

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # single broker: internal topics can only have one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12

  # Runs once: creates the topics (with retention limits) and the checkpoint signing key.
  init:
    <<: *app
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - audit-keys:/var/lib/safety-gate/keys
    entrypoint: ["sh", "-c"]
    # Every line of the script below has the same indentation on purpose: YAML
    # joins such lines into one. A deeper-indented line would start a new command.
    command:
      - >
        python -m safety_gate.topology &&
        ( [ -f /var/lib/safety-gate/keys/audit.key ] ||
        python -m safety_gate.checkpoints keygen
        --private /var/lib/safety-gate/keys/audit.key
        --public /var/lib/safety-gate/keys/audit.pub )

  gate:
    <<: *app
    command: ["safety_gate.gate"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      METRICS_PORT: "9100"
      GATE_POLICY_FILE: /app/examples/policy.yaml
    ports:
      - "9100:9100"          # http://localhost:9100/metrics and /healthz
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  audit-sink:
    <<: *app
    command: ["safety_gate.audit_sink"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      AUDIT_CHECKPOINT_FILE: /var/lib/safety-gate/checkpoints/checkpoints.jsonl
      AUDIT_CHECKPOINT_PRIVATE_KEY: /var/lib/safety-gate/keys/audit.key
      AUDIT_CHECKPOINT_EVERY: "100"
    volumes:
      - audit-keys:/var/lib/safety-gate/keys:ro
      - audit-checkpoints:/var/lib/safety-gate/checkpoints
    # No automatic restart: a sink that was cut off by a newer sink must stay down.
    restart: "no"

  model-service:
    <<: *app
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets a model on your own machine (e.g. Ollama) be reached
    command: ["safety_gate.model_stub"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: [*app-env, *model-env]
    restart: unless-stopped

  # The demo chatbot over HTTP: POST /direct/chat (no gate) and /protected/chat (through the gate),
  # and the demo console at http://localhost:8080/ (no login: published on this machine only)
  chat-api:
    <<: *app
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets a model on your own machine (e.g. Ollama) be reached
    command: ["safety_gate.chat_api"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: [*app-env, *model-env]
      CHAT_API_PORT: "8080"
      GATE_METRICS_URL: http://gate:9100/metrics
      REDTEAM_SUMMARIES_DIR: /app/redteam/summaries
    volumes:
      - ./redteam/summaries:/app/redteam/summaries:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  audit-keys:
  # In production this is the part that must live where Kafka admins cannot write.
  audit-checkpoints:
