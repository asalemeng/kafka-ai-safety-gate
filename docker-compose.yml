# The whole stack with one command:
#
#   docker compose up --build
#
# Kafka, the topics, the gate, the audit sink (with signed checkpoints) and the
# model service stub. Kafka is reachable from your machine on localhost:9092.
# This file is for local development: no login, no encryption.
# For TLS + login + ACLs see docker-compose.secure.yml.

x-app: &app
  build: .
  image: safety-gate:local
  environment: &app-env
    KAFKA_BOOTSTRAP: kafka:19092

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # single broker: internal topics can only have one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12

  # Runs once: creates the topics (with retention limits) and the checkpoint signing key.
  init:
    <<: *app
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - audit-keys:/var/lib/safety-gate/keys
    entrypoint: ["sh", "-c"]
    command:
      - >
        python -m safety_gate.topology &&
        ( [ -f /var/lib/safety-gate/keys/audit.key ] ||
          python -m safety_gate.checkpoints keygen
          --private /var/lib/safety-gate/keys/audit.key
          --public /var/lib/safety-gate/keys/audit.pub )

  gate:
    <<: *app
    command: ["safety_gate.gate"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      METRICS_PORT: "9100"
      GATE_POLICY_FILE: /app/examples/policy.yaml
    ports:
      - "9100:9100"          # http://localhost:9100/metrics and /healthz
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  audit-sink:
    <<: *app
    command: ["safety_gate.audit_sink"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      AUDIT_CHECKPOINT_FILE: /var/lib/safety-gate/checkpoints/checkpoints.jsonl
      AUDIT_CHECKPOINT_PRIVATE_KEY: /var/lib/safety-gate/keys/audit.key
      AUDIT_CHECKPOINT_EVERY: "100"
    volumes:
      - audit-keys:/var/lib/safety-gate/keys:ro
      - audit-checkpoints:/var/lib/safety-gate/checkpoints
    # No automatic restart: a sink that was cut off by a newer sink must stay down.
    restart: "no"

  model-service:
    <<: *app
    command: ["safety_gate.model_stub"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  audit-keys:
  # In production this is the part that must live where Kafka admins cannot write.
  audit-checkpoints:
